; Medora bedside unit firmware (owner: Hedi). See firmware/PINMAP.md and docs/contracts/mqtt-topics.md.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags =
  -DWARD_FW_VERSION=\"0.1.0\"
  -DMQTT_MAX_PACKET_SIZE=1280
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7
  adafruit/RTClib@^2.1
  adafruit/Adafruit MLX90614 Library@^2.1
  sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1
  miguelbalboa/MFRC522@^1.4
  waspinator/AccelStepper@^1.64
  bodmer/TFT_eSPI@^2.5
  lvgl/lvgl@^9

; Pure-logic unit tests on the laptop (ring buffer, schedule parsing, dose state machine).
; Run: pio test -e native
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
lib_deps =
  bblanchon/ArduinoJson@^7
