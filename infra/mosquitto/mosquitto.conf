# Medora demo broker. Password login + per-topic ACL (see docs/contracts/mqtt-topics.md, "Broker").
# Both files are generated/copied at container start by entrypoint.sh; no real password is committed.
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
