# Ward — full stack. Run from the repo root:
#   docker compose -f infra/docker-compose.yml --env-file .env up --build
name: ward

services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ward}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ward}
      POSTGRES_DB: ${POSTGRES_DB:-ward}
      TZ: UTC
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ward} -d ${POSTGRES_DB:-ward}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mqtt:
    image: eclipse-mosquitto:2
    ports: ["${MQTT_BIND:-0.0.0.0}:1883:1883"]
    # entrypoint.sh builds the password file from these accounts, then starts mosquitto (acl + conf from ./mosquitto)
    entrypoint: ["sh", "/ward-mosquitto/entrypoint.sh"]
    environment:
      MQTT_BACKEND_USERNAME: ${MQTT_BACKEND_USERNAME:-ward-backend}
      MQTT_BACKEND_PASSWORD: ${MQTT_BACKEND_PASSWORD:-change-me-mqtt}
      MQTT_DEVICE_CREDENTIALS: ${MQTT_DEVICE_CREDENTIALS:-bsu-001:change-me-bsu-001,bsu-002:change-me-bsu-002}
      WARD_ENV: ${WARD_ENV:-demo}
    volumes:
      - ./mosquitto:/ward-mosquitto:ro
      - mqtt-data:/mosquitto/data

  minio:
    image: cgr.dev/chainguard/minio:latest  # minio/minio is no longer published on Docker Hub
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ward}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-wardminio123}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes:
      - minio-data:/data

  n8n:
    image: n8nio/n8n:latest
    environment:
      GENERIC_TIMEZONE: Africa/Tunis
      TZ: Africa/Tunis
      N8N_SECURE_COOKIE: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"   # Code nodes read N8N_EVENT_SECRET (n8n 2.x blocks $env by default)
      WEBHOOK_URL: ${N8N_PUBLIC_URL:-http://localhost:5678/}   # base of W2 accept links; use the LAN IP for phones
      WARD_API_URL: ${WARD_API_URL:-http://api:8000}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      WARD_MAIL_FROM: ${WARD_MAIL_FROM:-Ward <ward@localhost>}
      N8N_CALLBACK_SECRET: ${N8N_CALLBACK_SECRET:-change-me-callback}
      N8N_EVENT_SECRET: ${N8N_EVENT_SECRET:-change-me-event}
      WAHA_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY:-change-me-waha}
      WARD_WHATSAPP_STAFF: ${WARD_WHATSAPP_STAFF:-}            # demo: staff numbers, comma-separated, e.g. 21612345678
      WARD_WHATSAPP_PATIENT: ${WARD_WHATSAPP_PATIENT:-}        # demo: the patient's number
    ports: ["${N8N_BIND:-0.0.0.0}:5678:5678"]
    volumes:
      - n8n-data:/home/node/.n8n
      - ../n8n/workflows:/ward-workflows:ro

  waha:   # WhatsApp gateway (WAHA): a WhatsApp account linked by QR code, like WhatsApp Web. Dashboard: http://localhost:3010/dashboard
    image: devlikeapro/waha:noweb   # NOWEB engine only: no bundled browser, smaller image
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB              # no browser: light on RAM
      WAHA_API_KEY: ${WAHA_API_KEY:-change-me-waha}
      WAHA_DASHBOARD_USERNAME: admin
      WAHA_DASHBOARD_PASSWORD: ${WAHA_API_KEY:-change-me-waha}
      WHATSAPP_RESTART_ALL_SESSIONS: "True"       # keep the linked session across restarts
      WAHA_NOWEB_STORE_ENABLED: "True"
    ports: ["127.0.0.1:3010:3000"]
    volumes:
      - waha-sessions:/app/.sessions

  api:
    build: ../backend
    env_file:
      - path: ../${WARD_ENV_FILE:-.env}
        required: false
    environment:
      WARD_ENV: ${WARD_ENV:-demo}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ward}:${POSTGRES_PASSWORD:-ward}@db:5432/${POSTGRES_DB:-ward}
      MQTT_HOST: mqtt
      MQTT_USERNAME: ${MQTT_BACKEND_USERNAME:-ward-backend}
      MQTT_PASSWORD: ${MQTT_BACKEND_PASSWORD:-change-me-mqtt}
      MINIO_ENDPOINT: minio:9000
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/ward-events
      WEB_URL: ${WEB_URL:-http://localhost:3000}
    ports: ["${API_BIND:-0.0.0.0}:${API_PORT:-8000}:8000"]
    depends_on:
      db: { condition: service_healthy }
      mqtt: { condition: service_started }
      minio: { condition: service_started }
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips \"${FORWARDED_ALLOW_IPS:-127.0.0.1}\""]

  worker:
    build: ../backend
    env_file:
      - path: ../${WARD_ENV_FILE:-.env}
        required: false
    environment:
      WARD_ENV: ${WARD_ENV:-demo}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ward}:${POSTGRES_PASSWORD:-ward}@db:5432/${POSTGRES_DB:-ward}
      MQTT_HOST: mqtt
      MQTT_USERNAME: ${MQTT_BACKEND_USERNAME:-ward-backend}
      MQTT_PASSWORD: ${MQTT_BACKEND_PASSWORD:-change-me-mqtt}
      MINIO_ENDPOINT: minio:9000
      LLM_LOCAL_BASE_URL: ${DOCKER_OLLAMA_URL:-http://host.docker.internal:11434}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/ward-events
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      db: { condition: service_healthy }
      mqtt: { condition: service_started }
      minio: { condition: service_started }
    command: ["python", "-m", "app.iot.worker"]

  web:
    build:
      context: ../web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_USE_MOCKS: ${NEXT_PUBLIC_USE_MOCKS:-1}
    ports: ["${WEB_BIND:-0.0.0.0}:${WEB_PORT:-3000}:3000"]
    depends_on: [api]

  proxy:
    image: caddy:2.8
    profiles: ["internet"]
    environment:
      WARD_DOMAIN: ${WARD_DOMAIN:-localhost}
      WARD_TLS: ${WARD_TLS:-internal}
    ports: ["80:80", "443:443"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [api, web]

volumes:
  db-data:
  mqtt-data:
  minio-data:
  n8n-data:
  caddy-data:
  waha-sessions:
